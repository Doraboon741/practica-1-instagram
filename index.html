<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>instareplica</title>
</head>
<body class="bodycont">
    <main class="container">
        <img src="instapng.png" alt="" class="logo_insta">
    <div class="container_left"> 
        <h1 class="container_titulo">Mira los momentos cotidianos de <br>tus<span class="container_titulo2"> mejores amigos.</span></h1>  
        <img src="reelejemplo.jpg" alt="" class="imagen_ref">
    </div>
    <div class="container_right">
        <div class="formulario"> 
            <div>
                <h3 class="container_h3">Iniciar sesión en Instagram</h3>
            </div>
            
            <div class="container__inputs">
                <input type="text" class="container__inputs__email" placeholder="Número de móvil, nombre de usuario o correo electrónico">
            </div>
            <input type="password" class="login" placeholder="Contraseña">
            <button class="button-log">Iniciar sesión</button>
            <p class="container-textillo">¿Has olvidado la contraseña?</p>
            <button class="container-face">Iniciar sesión con Facebook</button>
            <button class="container-cuenta">Crear una cuenta</button>
            <h3 class="container-meta">Metilla</h3>
        </div>   
    </div>
    </main>
</body>
</html>
